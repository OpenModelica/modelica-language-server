version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-root:
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    groups:
      npm-client:
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    groups:
      npm-server:
        update-types:
          - major
          - minor
          - patch
