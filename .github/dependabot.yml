version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # typescript-eslint currently requires TypeScript >=4.8.4 <6.1.0.
    # Remove this restriction when its peer dependency supports newer versions.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      npm-root:
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    groups:
      npm-client:
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    groups:
      npm-server:
        update-types:
          - major
          - minor
          - patch
