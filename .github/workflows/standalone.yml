name: Build standalone binary

  on:
    push:
      tags: ['v*']
    workflow_dispatch:

  jobs:
    build:
      name: ${{ matrix.os }}
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]

      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
            cache-dependency-path: server/package-lock.json

        - name: Build standalone binary
          run: cd server && npm ci && npm run build:standalone

        - name: Upload artifacts
          uses: actions/upload-artifact@v4
          with:
            name: modelica-language-server-${{ runner.os }}
            path: |
              server/out/modelica-language-server*
              server/out/tree-sitter-modelica.wasm
              server/out/web-tree-sitter.wasm

    release:
      name: Attach to release
      needs: build
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - uses: actions/download-artifact@v4
          with:
            path: artifacts/

        - name: Package per-platform archives
          run: |
            cd artifacts
            for dir in */; do
              platform="${dir%/}"
              tar -czf "${platform}.tar.gz" -C "$dir" .
            done

        - name: Upload to GitHub release
          uses: softprops/action-gh-release@v2
          with:
            files: artifacts/*.tar.gz
