name: Release
run-name: Release ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version committed in the package manifests, without v (e.g. 0.3.8)'
        required: true
        type: string
      dry_run:
        description: 'Run validation, tests and packaging without publishing'
        type: boolean
        default: false

permissions:
  contents: read

# Do not publish two releases concurrently or interrupt a release in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate package versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/validate-release.mjs "$RELEASE_VERSION"

      - name: Require a new release tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          existing_tag=$(git ls-remote --tags origin "refs/tags/v$RELEASE_VERSION")
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Tag v$RELEASE_VERSION already exists. Choose an unreleased version."
            exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/test.yml

  release:
    if: ${{ !inputs.dry_run }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - uses: actions/download-artifact@v8
        with:
          name: modelica-language-server.vsix

      - uses: actions/download-artifact@v8
        with:
          name: server-release
          path: server-release/

      - uses: actions/download-artifact@v8
        with:
          name: modelica-language-server-macos-arm64
          path: server-release/

      - uses: actions/download-artifact@v8
        with:
          name: modelica-language-server-macos-x64
          path: server-release/

      - uses: actions/download-artifact@v8
        with:
          name: modelica-language-server-windows-x64.exe
          path: server-release/

      - uses: actions/download-artifact@v8
        with:
          name: modelica-language-server-linux-arm64
          path: server-release/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            modelica-language-server-*.vsix
            server-release/openmodelica-modelica-language-server-*.tgz
            server-release/tree-sitter-modelica.wasm
            server-release/web-tree-sitter.wasm
            server-release/modelica-language-server-linux-x64
            server-release/modelica-language-server-linux-arm64
            server-release/modelica-language-server-macos-arm64
            server-release/modelica-language-server-macos-x64
            server-release/modelica-language-server-windows-x64.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish -i modelica-language-server-*.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: npx ovsx publish modelica-language-server-*.vsix -p "$OPEN_VSX_TOKEN"

      - name: Publish to npm
        run: |
          npm publish ./server-release/openmodelica-modelica-language-server-*.tgz --access public --provenance
